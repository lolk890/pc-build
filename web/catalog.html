<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог — PC Build</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .grid-placeholder {
        grid-column: 1 / -1;
        text-align: center;
        padding: 3rem;
        color: var(--text-muted);
      }
      .grid-error {
        grid-column: 1 / -1;
        text-align: center;
        padding: 3rem;
        color: var(--danger);
      }
      .catalog-message {
        grid-column: 1 / -1;
        text-align: center;
        padding: 0.5rem 1rem;
        margin: 0 0 1rem;
        color: var(--primary);
        font-size: 1.1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body data-page="catalog">
    <header class="site-header">
      <a href="index.html" class="brand">
        <img src="img/logo.png" alt="Логотип PC Build" />
        PC BUILD
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Главная</a></li>
          <li><a href="catalog.html" aria-current="page">Каталог</a></li>
          <li><a href="cart.html">Корзина</a></li>
          <li><a href="compare.html">Сравнение</a></li>
          <li><a href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
      <a href="login.html" class="btn-login">Войти</a>
    </header>

    <main>
      <h1>Все комплектующие</h1>
      <p class="lead">
        <span id="products-count">0</span> позиций от ведущих производителей.
        Используйте поиск или фильтры.
      </p>

      <section class="filters">
        <label class="search-full">
          Поиск по названию
          <input
            type="search"
            id="search-input"
            placeholder="Например, RTX 4060, Ryzen 5..."
          />
        </label>
        <label>
          Категория
          <select id="category-filter">
            <option value="">Все категории</option>
            <option value="Процессоры">Процессоры</option>
            <option value="Видеокарты">Видеокарты</option>
            <option value="Материнские платы">Материнские платы</option>
            <option value="Оперативная память">Оперативная память</option>
            <option value="Накопители">Накопители</option>
            <option value="Блоки питания">Блоки питания</option>
            <option value="Корпуса">Корпуса</option>
            <option value="Охлаждение">Охлаждение</option>
            <option value="Мониторы">Мониторы</option>
          </select>
        </label>
        <label>
          Платформа
          <select id="platform-filter">
            <option value="">Любая</option>
            <option value="LGA1700">LGA1700 (Intel)</option>
            <option value="AM5">AM5 (AMD)</option>
            <option value="PCIe 4.0">PCIe 4.0</option>
            <option value="PCIe 5.0">PCIe 5.0</option>
          </select>
        </label>
        <label>
          Сортировка
          <select id="sort-select">
            <option value="popular">По популярности</option>
            <option value="price-asc">Сначала дешевые</option>
            <option value="price-desc">Сначала дорогие</option>
            <option value="name">По названию</option>
          </select>
        </label>
        <button class="button" type="button" id="apply-filters">
          Применить
        </button>
        <button class="button-reset" type="button" id="reset-filters">
          Сбросить
        </button>
      </section>

      <h2>Список товаров</h2>
      <div class="grid" id="products-grid">
        <div class="grid-placeholder">Загрузка товаров...</div>
      </div>
    </main>

    <div class="image-modal" id="image-modal">
      <div class="image-modal-content">
        <span class="image-modal-close" id="image-modal-close">&times;</span>
        <img src="" alt="Увеличенное фото товара" id="modal-image" />
      </div>
    </div>

    <footer class="site-footer">
      <p>&copy; 2026 PC Build. Каталог комплектующих для компьютера.</p>
    </footer>

    <script src="products.js"></script>
    <script src="js/common.js"></script>
    <script src="js/catalog.js"></script>
  </body>
</html>
