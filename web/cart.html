<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Корзина — PC Build</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ====== ЗАГЛУШКИ КОРЗИНЫ ====== */
      .cart-placeholder {
        grid-column: 1 / -1;
        text-align: center;
        padding: 4rem 2rem;
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      .cart-placeholder h2 {
        margin: 0 0 1rem;
        padding-left: 0;
      }
      .cart-placeholder h2::before {
        display: none !important;
      }
      .cart-placeholder p {
        color: var(--text-muted);
        margin-bottom: 2rem;
      }

      /* ====== ТОВАРЫ В КОРЗИНЕ ====== */
      .cart-item-info h3 {
        font-size: 1.1rem;
        margin: 0 0 0.3rem;
      }
      .cart-item-info h3 a {
        color: var(--text);
        text-decoration: none;
      }
      .cart-item-info h3 a:hover {
        color: var(--primary);
      }
      .cart-item-meta {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      /* ====== РАСКЛАДКА ====== */
      .cart-layout {
        margin-top: 2rem;
      }

      /* ====== ИТОГИ ====== */
      .summary-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.8rem 0;
        margin: 0.5rem 0 0 0;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent);
      }

      /* Кнопка "Оформить сборку" — без свечения */
      .cart-summary .button {
        width: 100%;
        text-align: center;
        margin: 0 0 0.4rem 0;
        box-shadow: none;
        letter-spacing: 0.05em;
        font-size: 0.95rem;
      }
      .cart-summary .button:hover {
        transform: none;
        box-shadow: none;
      }

      /* Ссылка "Вернуться в каталог" — синяя кнопка-контур */
      .cart-summary .button-secondary {
        display: block;
        width: 100%;
        text-align: center;
        margin-top: 0.5rem;
        box-shadow: none;
      }
      .cart-summary .button-secondary:hover {
        transform: none;
      }

      /* Результат оформления — скрыт по умолчанию */
      .checkout-result {
        margin: 0.5rem 0;
        padding: 0.8rem;
        background: rgba(57, 255, 20, 0.08);
        border: 1px solid rgba(57, 255, 20, 0.25);
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        color: var(--text);
        display: none;
      }
      .checkout-result:not(:empty) {
        display: block;
      }
      .checkout-result .checkout-loading {
        color: var(--primary);
        font-style: italic;
      }
      .checkout-result .checkout-success {
        color: var(--accent);
        font-weight: 600;
      }
      .cart-back-link {
        display: block;
        text-align: center;
        margin-top: 0.4rem;
        padding: 0.85rem 1.2rem;
        border: 2px solid var(--primary);
        border-radius: var(--radius);
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        background: transparent;
        box-sizing: border-box;
        line-height: 1.4;
      }

      .cart-back-link:hover {
        background: var(--primary);
        color: var(--bg);
      }
    </style>
  </head>
  <body data-page="cart">
    <header class="site-header">
      <a href="index.html" class="brand">
        <img src="img/logo.png" alt="Логотип PC Build" />
        PC BUILD
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Главная</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="cart.html" aria-current="page">Корзина</a></li>
          <li><a href="compare.html">Сравнение</a></li>
          <li><a href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
      <a href="login.html" class="btn-login">Войти</a>
    </header>

    <main>
      <h1>Корзина</h1>

      <div class="cart-layout">
        <div class="cart-items" id="cart-items">
          <div class="cart-placeholder">Загрузка корзины...</div>
        </div>

        <aside class="cart-summary">
          <h2>Итого</h2>
          <div class="summary-row">
            <span>Товаров в сборке:</span>
            <span id="cart-count">0</span>
          </div>
          <div class="summary-total">
            <span>Сумма:</span>
            <span id="cart-total">0 ₽</span>
          </div>

          <button class="button" type="button" id="btn-checkout">
            Оформить сборку
          </button>
          <div class="checkout-result" id="checkout-result"></div>
          <a href="catalog.html" class="cart-back-link">Вернуться в каталог</a>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 PC Build. Каталог комплектующих для компьютера.</p>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
